<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — MOHD.HMS ENTERPRISE</title>
<link rel="icon" href="/brand/icon-32.png" />
<style>
  :root { --green: #0c2414; --accent: #22c55e; --text: #1f2937; --muted: #6b7280; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Poppins", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f6f8f6; color: var(--text);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 20px;
    max-width: 26rem; width: 100%; padding: 40px 32px; text-align: center;
    box-shadow: 0 10px 30px rgba(12, 36, 20, 0.06);
  }
  .logo { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 2px 10px rgba(12,36,20,.15); }
  h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .02em; margin: 18px 0 6px; color: var(--green); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 600;
    color: #92400e; background: #fef3c7; border: 1px solid #fde68a; border-radius: 999px; padding: 5px 14px; margin: 10px 0 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
  p { font-size: .9rem; color: var(--muted); line-height: 1.55; margin: 10px 0 24px; }
  button {
    font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer;
    background: var(--green); color: #fff; border: 0; border-radius: 12px;
    padding: 12px 28px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { margin-top: 18px; font-size: .75rem; color: var(--muted); }
  .brand { margin-top: 26px; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1210; }
    .card { background: #111b16; border-color: #1f2e25; }
    h1 { color: #4ade80; } p, .hint, .brand { color: #9ca3af; }
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <img class="logo" src="/brand/icon-192.png" alt="MOHD HMS Enterprise logo" />
    <h1>MOHD.HMS ENTERPRISE</h1>
    <span class="status" id="status"><span class="dot" aria-hidden="true"></span> You're offline</span>
    <p>Some online features are temporarily unavailable.<br />
       Your drafts are saved on this device and will sync when you're back online.</p>
    <button id="retry" type="button">Try again</button>
    <p class="hint">Reconnection is detected automatically.</p>
    <div class="brand">Smart Facility Maintenance Management</div>
  </main>
  <script>
    var btn = document.getElementById("retry");
    btn.addEventListener("click", function () {
      btn.disabled = true; btn.textContent = "Reconnecting…";
      location.reload();
    });
    // Auto-recover the full app the moment connectivity returns.
    window.addEventListener("online", function () { location.replace("/dashboard"); });
  </script>
</body>
</html>
